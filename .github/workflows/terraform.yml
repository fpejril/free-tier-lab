name: "Terraform"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - module: oci/dev
            plan_name: oci-dev
          - module: oci/global
            plan_name: oci-global

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Terraform Format
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan
          applyable=$(terraform show -json tfplan | jq '.applyable')
          echo "Plan applyable flag: ${applyable}"
          if [ "$applyable" = "true" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}/tfplan
          if-no-files-found: error

  plan-summary:
    name: Summarize plan results
    runs-on: ubuntu-latest
    needs: terraform-plan
    outputs:
      any_changes: ${{ steps.summary.outputs.any_changes }}
      apply_matrix: ${{ steps.summary.outputs.apply_matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download plan artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tfplan-*
          path: tfplans
          merge-multiple: true

      - name: Summarize module change state
        id: summary
        run: |
          set -euo pipefail
          mapfile -t artifacts < <(find tfplans -maxdepth 1 -type f -name 'tfplan-*')
          if [ "${#artifacts[@]}" -eq 0 ]; then
            echo "No tfplan artifacts were found; nothing to apply." >> "$GITHUB_STEP_SUMMARY"
            echo "any_changes=false" >> "$GITHUB_OUTPUT"
            echo 'apply_matrix={"include":[]}' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          any=false
          matrix_json="{\"include\":["
          first=true
          declare -A module_path_map=(
            ["oci-dev"]="oci/dev"
            ["oci-global"]="oci/global"
          )
          for file in "${artifacts[@]}"; do
            name="${file##*/tfplan-}"
            path="${module_path_map[$name]}"
            if [ -z "$path" ]; then
              echo "Unknown plan artifact '$name'; cannot map to module path." >&2
              exit 1
            fi
            any=true
            printf '| %s | true |\n' "$name" >> "$GITHUB_STEP_SUMMARY"
            entry="{\"module\":\"${path}\",\"plan_name\":\"${name}\"}"
            if [ "$first" = true ]; then
              matrix_json="${matrix_json}${entry}"
              first=false
            else
              matrix_json="${matrix_json},${entry}"
            fi
          done

          echo "any_changes=$any" >> "$GITHUB_OUTPUT"
          matrix_json="${matrix_json}]}"
          echo "apply_matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  terraform-apply:
    name: Terraform Apply - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - terraform-plan
      - plan-summary
    if: github.ref == 'refs/heads/fpejril-patch-1' && github.event_name == 'push' && needs.plan-summary.outputs.any_changes == 'true'
    environment: development

    strategy:
      matrix:
        ${{ fromJSON(needs.plan-summary.outputs.apply_matrix) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}

      - name: Terraform Apply (approved plan)
        working-directory: ${{ matrix.module }}
        run: terraform apply -input=false tfplan
