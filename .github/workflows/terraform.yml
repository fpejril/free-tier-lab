name: "Terraform"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - module: oci/dev
            plan_name: oci-dev
          - module: oci/global
            plan_name: oci-global

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Terraform Format
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.module }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan
          applyable=$(terraform show -json tfplan | jq '.applyable')
          echo "Plan applyable flag: ${applyable}"
          if [ "$applyable" = "true" ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload plan artifact
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}/tfplan
          if-no-files-found: error

      - name: Publish plan metadata
        run: |
          applyable="${{ steps.plan.outputs.changes }}"
          cat <<JSON > "plan-meta-${{ matrix.plan_name }}.json"
          {
            "module": "${{ matrix.module }}",
            "plan_name": "${{ matrix.plan_name }}",
            "applyable": ${applyable:-false}
          }
          JSON

      - name: Upload metadata artifact
        uses: actions/upload-artifact@v4
        with:
          name: plan-meta-${{ matrix.plan_name }}
          path: plan-meta-${{ matrix.plan_name }}.json
          if-no-files-found: error

  plan-summary:
    name: Summarize plan results
    runs-on: ubuntu-latest
    needs: terraform-plan
    outputs:
      any_changes: ${{ steps.summary.outputs.any_changes }}
      apply_matrix: ${{ steps.summary.outputs.apply_matrix }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Download plan metadata artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plan-meta-*
          path: plan-meta
          merge-multiple: true

      - name: Summarize module change state
        id: summary
        run: |
          set -euo pipefail
          mapfile -d '' files < <(find plan-meta -type f -name 'plan-meta-*.json' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No plan metadata artifacts were found; cannot determine plan summary." >&2
            exit 1
          fi

          any=false
          matrix_json="{\"include\":["
          first=true
          for file in "${files[@]}"; do
            value=$(jq -r '.applyable' "$file")
            module=$(jq -r '.plan_name' "$file")
            module_path=$(jq -r '.module' "$file")
            printf '| %s | %s |\n' "$module" "$value" >> "$GITHUB_STEP_SUMMARY"
            if [ "$value" = "true" ]; then
              any=true
              entry="{\"module\":\"${module_path}\",\"plan_name\":\"${module}\"}"
              if [ "$first" = true ]; then
                matrix_json="${matrix_json}${entry}"
                first=false
              else
                matrix_json="${matrix_json},${entry}"
              fi
            fi
          done
          echo "any_changes=$any" >> "$GITHUB_OUTPUT"
          matrix_json="${matrix_json}]}"
          echo "apply_matrix=$matrix_json" >> "$GITHUB_OUTPUT"

  terraform-apply:
    name: Terraform Apply - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - terraform-plan
      - plan-summary
    if: github.ref == 'refs/heads/fpejril-patch-1' && github.event_name == 'push' && needs.plan-summary.outputs.any_changes == 'true'
    environment: development

    strategy:
      matrix:
        ${{ fromJSON(needs.plan-summary.outputs.apply_matrix) }}

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}

      - name: Terraform Apply (approved plan)
        working-directory: ${{ matrix.module }}
        run: terraform apply -input=false tfplan
