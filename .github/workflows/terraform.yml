name: "Terraform"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - module: oci/dev
            plan_name: oci-dev
          - module: oci/global
            plan_name: oci-global

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Terraform Format
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check

      - name: Terraform Plan
        working-directory: ${{ matrix.module }}
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}/tfplan
          if-no-files-found: error

  terraform-apply:
    name: Terraform Apply - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs: terraform-plan
    if: github.ref == 'refs/heads/fpejril-patch-1' && github.event_name == 'push'
    environment: development

    strategy:
      matrix:
        include:
          - module: oci/dev
            plan_name: oci-dev
          - module: oci/global
            plan_name: oci-global

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Download saved plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: .

      - name: Terraform Apply (approved plan)
        working-directory: ${{ matrix.module }}
        run: terraform apply -input=false tfplan
