name: "Terraform"

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  terraform-plan:
    name: Terraform Plan - ${{ matrix.module }}
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - module: oci/dev
            plan_name: oci-dev
          - module: oci/global
            plan_name: oci-global

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Terraform Format
        working-directory: ${{ matrix.module }}
        run: terraform fmt -check

      - name: Terraform Plan
        id: plan
        working-directory: ${{ matrix.module }}
        run: |
          set -uo pipefail
          exit_code=0
          terraform plan -input=false -detailed-exitcode -out=tfplan || exit_code=$?
          if [ "$exit_code" -eq 1 ]; then
            exit 1
          elif [ "$exit_code" -eq 2 ]; then
            echo "changes=true" >> "$GITHUB_OUTPUT"
          else
            echo "changes=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Save plan status metadata
        run: |
          echo "${{ steps.plan.outputs.changes }}" > "plan-status-${{ matrix.plan_name }}.txt"

      - name: Upload plan artifact
        if: steps.plan.outputs.changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}/tfplan
          if-no-files-found: error

      - name: Upload plan status
        uses: actions/upload-artifact@v4
        with:
          name: plan-status-${{ matrix.plan_name }}
          path: plan-status-${{ matrix.plan_name }}.txt
          if-no-files-found: error

  plan-summary:
    name: Summarize plan results
    runs-on: ubuntu-latest
    needs: terraform-plan
    outputs:
      any_changes: ${{ steps.summary.outputs.any_changes }}
      changes_json: ${{ steps.summary.outputs.changes_json }}
    steps:
      - name: Download plan status artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: plan-status-*
          path: plan-status
          merge-multiple: true

      - name: Summarize module change state
        id: summary
        run: |
          set -euo pipefail
          any=false
          json="{"
          first=true
          shopt -s nullglob
          for file in plan-status/plan-status-*.txt; do
            module="${file##*/plan-status-}"
            module="${module%.txt}"
            value=$(cat "$file")
            if [ "$value" = "true" ]; then
              any=true
            fi
            if [ "$first" = true ]; then
              json="${json}\"${module}\":${value}"
              first=false
            else
              json="${json},\"${module}\":${value}"
            fi
          done
          json="${json}}"
          echo "any_changes=$any" >> "$GITHUB_OUTPUT"
          echo "changes_json=$json" >> "$GITHUB_OUTPUT"

  terraform-apply:
    name: Terraform Apply - ${{ matrix.module }}
    runs-on: ubuntu-latest
    needs:
      - terraform-plan
      - plan-summary
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.plan-summary.outputs.any_changes == 'true'
    environment: development

    strategy:
      matrix:
        include:
          - module: oci/dev
            plan_name: oci-dev
          - module: oci/global
            plan_name: oci-global

    defaults:
      run:
        shell: bash

    env:
      MODULE_HAS_CHANGES: ${{ fromJSON(needs.plan-summary.outputs.changes_json)[matrix.plan_name] }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          version: "1.14.0"

      - name: Configure OCI profile
        run: |
          mkdir -p "${HOME}/.oci"
          {
            echo "[DEFAULT]"
            echo "user=${{ secrets.OCI_USER_OCID }}"
            echo "fingerprint=${{ secrets.OCI_FINGERPRINT }}"
            echo "key_file=${HOME}/.oci/oci_api_key.pem"
            echo "tenancy=${{ secrets.OCI_TENANCY_OCID }}"
            echo "region=${{ vars.OCI_REGION }}"
          } > "${HOME}/.oci/config"
          printf '%s' "${{ secrets.OCI_PRIVATE_KEY }}" > "${HOME}/.oci/oci_api_key.pem"
          chmod 600 "${HOME}/.oci/oci_api_key.pem" "${HOME}/.oci/config"

      - name: Terraform Init
        if: env.MODULE_HAS_CHANGES == 'true'
        working-directory: ${{ matrix.module }}
        run: terraform init

      - name: Download saved plan
        if: env.MODULE_HAS_CHANGES == 'true'
        uses: actions/download-artifact@v4
        with:
          name: tfplan-${{ matrix.plan_name }}
          path: ${{ matrix.module }}

      - name: Terraform Apply (approved plan)
        if: env.MODULE_HAS_CHANGES == 'true'
        working-directory: ${{ matrix.module }}
        run: terraform apply -input=false tfplan
